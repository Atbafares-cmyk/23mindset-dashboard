<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>23 MindSet — Tableau de bord</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fdf0f3;color:#1a1a1a;min-height:100vh;padding:1.5rem}
.db-wrap{max-width:1200px;margin:0 auto}
.db-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;background:#fff;border-radius:12px;padding:.85rem 1.5rem;border:1px solid #f0d0d8}
.db-logo-img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.db-logo-text{font-size:19px;font-weight:700;color:#1a1a1a;letter-spacing:-.3px}.db-logo-text span{color:#c0395a}
.db-logo-wrap{display:flex;align-items:center;gap:10px}
.db-header-right{display:flex;align-items:center;gap:12px}
.db-date{font-size:13px;color:#999}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:1.25rem}
.kpi{background:#fff;border-radius:10px;padding:1rem 1.25rem;border:1px solid #f0d0d8}
.kpi-label{font-size:12px;color:#999;margin-bottom:5px}
.kpi-value{font-size:22px;font-weight:700;color:#1a1a1a}
.kpi-sub{font-size:11px;color:#bbb;margin-top:3px}
.kpi.accent .kpi-value{color:#c0395a}.kpi.warn .kpi-value{color:#9a5200}
.charts-section{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:1.25rem}
.chart-card{background:#fff;border-radius:12px;border:1px solid #f0d0d8;padding:1.25rem}
.chart-card h4{font-size:13px;font-weight:600;color:#888;margin-bottom:1rem;text-transform:uppercase;letter-spacing:.4px}
.chart-wrap{position:relative;height:220px}
.client-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cl-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#666}
.cl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.toolbar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input[type=text]{height:34px;font-size:13px;padding:0 10px;border:1px solid #e8c0cc;border-radius:8px;background:#fff;color:#1a1a1a;outline:none}
.btn-sort{height:34px;padding:0 12px;font-size:13px;background:#fff;border:1px solid #e8c0cc;border-radius:8px;cursor:pointer;color:#555;white-space:nowrap}
.btn-sort:hover,.btn-sort.active{border-color:#c0395a;color:#c0395a;background:#fff0f3}
.btn-add{height:34px;padding:0 14px;font-size:13px;font-weight:600;background:#c0395a;color:#fff;border:none;border-radius:8px;cursor:pointer;margin-left:auto}
.btn-add:hover{background:#a02a46}
.btn-clients{height:34px;padding:0 14px;font-size:13px;font-weight:600;background:#fff;color:#c0395a;border:1px solid #c0395a;border-radius:8px;cursor:pointer}
.btn-clients:hover{background:#fff0f3}
.btn-sat{height:34px;padding:0 14px;font-size:13px;font-weight:600;background:#fff;color:#888;border:1px solid #e8c0cc;border-radius:8px;cursor:pointer}
.btn-sat:hover,.btn-sat.active{background:#fdf0f3;color:#c0395a;border-color:#c0395a}
.table-wrap{overflow-x:auto;border:1px solid #f0d0d8;border-radius:12px;background:#fff;margin-bottom:1rem}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#fff8f9;padding:9px 11px;text-align:left;font-weight:600;font-size:11px;color:#aaa;border-bottom:1px solid #f0d0d8;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
tbody tr{border-bottom:1px solid #fceef1}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#fff8f9}
tbody tr.future{background:#f8f0ff}
tbody tr.future:hover{background:#f0e4ff}
td{padding:9px 11px;color:#1a1a1a;vertical-align:middle}
.client-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge.paye{background:#EAF3DE;color:#3B6D11}.badge.attente{background:#FAEEDA;color:#854F0B}
.badge.avenir{background:#f0e8ff;color:#5b2d8e}.badge.litige{background:#FCEBEB;color:#A32D2D}
.badge.urssaf-ok{background:#EAF3DE;color:#3B6D11;cursor:pointer;user-select:none}
.badge.urssaf-no{background:#FCEBEB;color:#A32D2D;cursor:pointer;user-select:none}
.badge.type{background:#fceef1;color:#c0395a;border:1px solid #f0d0d8;font-size:11px}
.sep-row td{background:#fdf0f3;color:#c0395a;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:5px 11px;border-bottom:1px solid #f0d0d8}
.reg-date{font-size:12px;font-weight:500;white-space:nowrap;color:#c0395a}
.reg-date.late{color:#A32D2D}.reg-date.soon{color:#9a5200}.reg-date.none{color:#ccc;font-style:italic}
.actions{display:flex;gap:3px;align-items:center}
.btn-edit{background:none;border:none;color:#ccc;cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px}
.btn-edit:hover{color:#c0395a;background:#fff0f3}
.btn-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px}
.btn-del:hover{color:#E24B4A;background:#fff0f0}
.mini-select{font-size:11px;height:24px;padding:0 3px;border:1px solid #f0d0d8;border-radius:4px;background:#fff8f9;color:#888;cursor:pointer}
/* SATISFACTION */
.sat-section{background:#fff;border-radius:12px;border:1px solid #f0d0d8;padding:1.25rem;margin-bottom:1rem}
.sat-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:1rem}
.sat-header h4{font-size:13px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.4px;padding-top:4px}
.sat-filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sat-filters select{height:30px;font-size:12px;padding:0 8px;border:1px solid #e8c0cc;border-radius:7px;background:#fff;outline:none;color:#555}
.sat-count{font-size:12px;color:#bbb;white-space:nowrap}
.sat-groups{display:flex;flex-direction:column;gap:1.1rem}
.sat-group-title{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.sat-cards{display:flex;flex-wrap:wrap;gap:8px}
.sat-card{border-radius:10px;border:2px solid #eee;padding:12px 16px;min-width:120px;text-align:center;background:#fafafa}
.sat-card.good{border-color:#86efac;background:#f0fdf4}.sat-card.medium{border-color:#fed7aa;background:#fff7ed}.sat-card.low{border-color:#fca5a5;background:#fef2f2}
.sat-card-label{font-size:11px;color:#888;margin-bottom:4px}
.sat-card-value{font-size:20px;font-weight:700}
.sat-card.good .sat-card-value{color:#16a34a}.sat-card.medium .sat-card-value{color:#d97706}.sat-card.low .sat-card-value{color:#dc2626}
.sat-card-sub{font-size:10px;color:#bbb;margin-top:2px}
.sat-empty{color:#bbb;font-size:13px;text-align:center;padding:2rem;line-height:1.8}
.sat-badge{display:inline-block;padding:2px 5px;border-radius:5px;font-size:10px;font-weight:700;margin-left:4px;vertical-align:middle}
.sat-badge.good{background:#f0fdf4;color:#16a34a}.sat-badge.medium{background:#fff7ed;color:#d97706}.sat-badge.low{background:#fef2f2;color:#dc2626}
/* BOTTOM */
.urssaf-bar,.delais-info{background:#fff;border-radius:10px;padding:.875rem 1.25rem;border:1px solid #f0d0d8;display:flex;gap:1.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.75rem}
.urssaf-item,.delais-item{font-size:13px;color:#999}
.urssaf-item strong{color:#1a1a1a;font-weight:600}.urssaf-item strong.warn{color:#9a5200}
.delais-item strong{color:#777;font-weight:500}
/* MODALS */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding-top:50px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:14px;border:1px solid #f0d0d8;padding:1.75rem;width:540px;max-width:95vw;box-shadow:0 8px 32px rgba(192,57,90,.12);margin-bottom:2rem}
.modal-title{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
.modal-title h3{font-size:16px;font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:600}
.pill.new{background:#fceef1;color:#c0395a}.pill.edit{background:#FAEEDA;color:#854F0B}.pill.clients{background:#e0f2fe;color:#0369a1}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;color:#999;margin-bottom:4px;font-weight:500}
.form-row input,.form-row select{width:100%;height:38px;padding:0 12px;font-size:13px;border:1px solid #e8c0cc;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;font-family:inherit}
.form-row input:focus,.form-row select:focus{border-color:#c0395a;box-shadow:0 0 0 3px rgba(192,57,90,.1)}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-hint{font-size:11px;color:#bbb;margin-top:3px}
.preview{background:#fff0f3;border:1px solid #f0c0cc;border-radius:8px;padding:10px 14px;margin:8px 0 4px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.preview strong{color:#c0395a;font-weight:600}.preview span{color:#999;font-size:12px}
.reg-preview{background:#f8f0ff;border:1px solid #d8b8f4;border-radius:8px;padding:8px 14px;margin-top:6px;font-size:12px;color:#5b2d8e}
.certif-note{background:#f0e8ff;border-radius:8px;padding:7px 12px;margin-top:8px;font-size:12px;color:#5b2d8e}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;padding-top:1rem;border-top:1px solid #fceef1}
.btn-cancel{height:36px;padding:0 16px;font-size:13px;background:none;border:1px solid #e8c0cc;border-radius:8px;color:#999;cursor:pointer}
.btn-cancel:hover{background:#fff8f9}
.btn-save{height:36px;padding:0 16px;font-size:13px;font-weight:600;background:#c0395a;color:#fff;border:none;border-radius:8px;cursor:pointer}
.btn-save:hover{background:#a02a46}
.empty{text-align:center;padding:2.5rem;color:#bbb;font-size:13px}
.date-mode-tabs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.date-tab{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;border:1px solid #e8c0cc;cursor:pointer;background:#fff;color:#aaa}
.date-tab.active{background:#fceef1;color:#c0395a;border-color:#c0395a}
.date-tab:hover:not(.active){border-color:#c0395a;color:#c0395a}
.multi-dates-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:40px;padding:8px;background:#fafafa;border-radius:8px;border:1px solid #f0d0d8}
.multi-date-tag{display:flex;align-items:center;gap:4px;background:#fceef1;border:1px solid #f0c0cc;border-radius:6px;padding:4px 8px;font-size:12px;color:#c0395a}
.multi-date-tag button{background:none;border:none;cursor:pointer;color:#c0395a;font-size:15px;line-height:1;padding:0 2px;opacity:.6}
.multi-date-tag button:hover{opacity:1}
.multi-date-add{display:flex;gap:6px;align-items:center;margin-top:8px}
.multi-date-add input{flex:1;height:34px;padding:0 10px;font-size:13px;border:1px solid #e8c0cc;border-radius:8px;outline:none;font-family:inherit}
.multi-date-add input:focus{border-color:#c0395a}
.btn-add-date{height:34px;padding:0 14px;font-size:13px;font-weight:600;background:#c0395a;color:#fff;border:none;border-radius:8px;cursor:pointer}
.btn-add-date:hover{background:#a02a46}
.color-palette{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.color-swatch.selected{border-color:#1a1a1a;transform:scale(1.15)}
.client-list-items{margin-bottom:1rem}
.client-row-mgr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #fceef1}
.client-row-mgr:last-child{border-bottom:none}
.client-dot-lg{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.client-name-lg{flex:1;font-size:13px;font-weight:600}
.client-info-sm{font-size:11px;color:#aaa;flex:2}
.cert-badge{display:inline-block;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:600;background:#f0e8ff;color:#5b2d8e}
.section-label{font-size:11px;color:#aaa;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;margin-top:14px}
.tarif-row{display:flex;gap:6px;align-items:center;margin-bottom:7px}
.tarif-row input{height:32px;padding:0 8px;font-size:12px;border:1px solid #e8c0cc;border-radius:6px;outline:none;font-family:inherit}
.tarif-row input:focus{border-color:#c0395a}
.tarif-row select{height:32px;padding:0 4px;font-size:12px;border:1px solid #e8c0cc;border-radius:6px;background:#fff;outline:none}
.btn-remove-tarif{background:none;border:none;color:#ccc;cursor:pointer;font-size:18px;padding:0 4px}
.btn-remove-tarif:hover{color:#E24B4A}
.btn-add-tarif{height:30px;padding:0 12px;font-size:12px;background:#fff;border:1px dashed #c0395a;color:#c0395a;border-radius:6px;cursor:pointer;margin-top:4px}
.btn-add-tarif:hover{background:#fff0f3}
.btn-new-client{width:100%;height:36px;font-size:13px;font-weight:600;background:#c0395a;color:#fff;border:none;border-radius:8px;cursor:pointer;margin-top:8px}
.btn-new-client:hover{background:#a02a46}
@media(max-width:700px){.charts-section{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}.form-2col{grid-template-columns:1fr}}
</style>

<body>
<div class="db-wrap" id="app"></div>
<script>
const LOGO_SRC=`data:image/svg+xml;charset=utf-8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42"><circle cx="21" cy="21" r="21" fill="%23c0395a"/><text x="21" y="26" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">23M</text></svg>')}`;
const STATUTS=["Payé","En attente","À venir","Litige"];
const TAUX=0.26;const HEURES_PAR_JOUR=7;
const COLOR_PALETTE=["#c0395a","#7c3aed","#0891b2","#d97706","#059669","#dc2626","#2563eb","#db2777","#0f766e","#92400e","#4f46e5","#be185d","#0284c7","#16a34a","#9333ea"];
const THEMES=["Management","Communication","Vente / Dév. commercial","Phoning","Gestion du stress","Gestion de conflits","Posture professionnelle","Leadership","Prise de parole","Cohésion d'équipe","Techniques pédagogiques","Autre"];
const DEFAULT_CLIENTS=[
  {name:"Formasuite",hex:"#c0395a",certifiante:false,tarifs:[{label:"Journée",taux:400,unite:"j"}],delai:{jours:45,regle:"standard"}},
  {name:"Bahy",hex:"#7c3aed",certifiante:true,tarifs:[{label:"Formation CBS",taux:25,unite:"h"},{label:"Jury",taux:25,unite:"h"}],delai:{jours:30,regle:"le15"}},
  {name:"My Partner School",hex:"#0891b2",certifiante:true,tarifs:[{label:"Heure",taux:50,unite:"h"}],delai:{jours:30,regle:"standard"}},
  {name:"Exchange Collège",hex:"#d97706",certifiante:true,tarifs:[{label:"Bachelor 1",taux:40,unite:"h"},{label:"Bachelor 3",taux:50,unite:"h"}],delai:{jours:30,regle:"standard"}},
];
const MISSION_KEY="mindset_v6";const CLIENTS_KEY="mindset_clients_v2";

// ── CLIENTS ─────────────────────────────────────────
function loadClients(){
  try{const s=localStorage.getItem(CLIENTS_KEY);if(s)return JSON.parse(s).map(c=>({certifiante:false,...c}));}catch(e){}
  return DEFAULT_CLIENTS.map(c=>({...c,tarifs:c.tarifs.map(t=>({...t}))}));
}
function saveClients(){try{localStorage.setItem(CLIENTS_KEY,JSON.stringify(clients));}catch(e){}}
let clients=loadClients();
function getClient(n){return clients.find(c=>c.name===n)||null;}
function clientColor(n){const c=getClient(n);const h=c?c.hex:"#888";return{bg:h+"22",text:h,hex:h};}
function defTarif(n){const c=getClient(n);return(c&&c.tarifs&&c.tarifs.length)?c.tarifs[0]:{label:"Heure",taux:0,unite:"h"};}
function isCert(n){const c=getClient(n);return c?!!c.certifiante:false;}

// ── HELPERS ──────────────────────────────────────────
function calcReg(df,cn){
  if(!df)return null;const d=new Date(df);if(isNaN(d))return null;
  const c=getClient(cn);const cfg=c?c.delai:{jours:30,regle:"standard"};
  d.setDate(d.getDate()+(cfg.jours||30));
  if(cfg.regle==="le15"){if(d.getDate()<=15)d.setDate(15);else{d.setMonth(d.getMonth()+1);d.setDate(15);}}
  return d;
}
function fmtDateObj(d){return d?d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"}):null;}
function regStatus(df,cn,st){
  if(st==="Payé")return{label:"Encaissé",cls:"reg-date"};
  if(!df)return{label:"—",cls:"reg-date none"};
  const reg=calcReg(df,cn);if(!reg)return{label:"—",cls:"reg-date none"};
  const today=new Date();today.setHours(0,0,0,0);
  const diff=Math.round((reg-today)/86400000);const label=fmtDateObj(reg);
  if(diff<0)return{label:"⚠ "+label,cls:"reg-date late"};
  if(diff<=7)return{label:"⚡ "+label,cls:"reg-date soon"};
  return{label,cls:"reg-date"};
}
function primaryDate(m){
  if((m.dateMode||"single")==="multi"){const ds=[...(m.dates||[])].sort();return ds[0]||"";}
  return m.dateDebut||m.date||"";
}
function fmtMissionDate(m){
  const mode=m.dateMode||"single";
  if(mode==="range"){const d1=fd(m.dateDebut||m.date);const d2=m.dateFin?fd(m.dateFin):"";return d2?`${d1}→${d2}`:d1;}
  if(mode==="multi"){const ds=[...(m.dates||[])].sort();if(!ds.length)return"—";return ds.slice(0,2).map(fd).join(", ")+(ds.length>2?` +${ds.length-2}`:"");}
  return fd(m.dateDebut||m.date);
}
function joursM(m){return m.unite==="j"?parseFloat(m.qte)||0:(parseFloat(m.qte)||0)/HEURES_PAR_JOUR;}
function ca(m){return Math.round((parseFloat(m.taux)||0)*(parseFloat(m.qte)||0));}
function urssafM(m){return Math.round(ca(m)*TAUX);}
function fmt(n){return Math.round(n).toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});}
function fd(d){if(!d)return"—";const[y,mo,j]=d.split("-");return`${j}/${mo}/${y}`;}
function fmtMois(ym){if(!ym)return"";const[,m]=ym.split("-");return["","Jan","Fév","Mar","Avr","Mai","Juin","Juil","Août","Sep","Oct","Nov","Déc"][parseInt(m)]+" "+ym.split("-")[0];}
function qteLabel(m){return m.unite==="j"?`${m.qte}j`:`${m.qte}h`;}
function satCls(s){return s>=90?"good":s>=75?"medium":"low";}
function parseSat(v){return(v===''||v===undefined||v===null)?null:parseFloat(v);}

// ── DATA ─────────────────────────────────────────────
function loadData(){
  try{const s=localStorage.getItem(MISSION_KEY);if(s)return JSON.parse(s).map(m=>({theme:"",satisfaction:null,dateMode:"single",dateDebut:m.date||"",dateFin:"",dates:[],...m}));}catch(e){}
  return[
    {id:1,client:"Formasuite",intitule:"Management CERTIFER – Valenciennes",date:"2026-03-15",dateMode:"single",dateDebut:"2026-03-15",dateFin:"",dates:[],theme:"Management",satisfaction:97,dateFacture:"2026-03-17",taux:400,qte:2,unite:"j",type:"Journée",statut:"Payé",urssafPaye:true},
    {id:2,client:"Bahy",intitule:"NTC – Séances 7 & 8",date:"2026-04-02",dateMode:"single",dateDebut:"2026-04-02",dateFin:"",dates:[],theme:"",satisfaction:null,dateFacture:"2026-04-03",taux:25,qte:14,unite:"h",type:"Formation CBS",statut:"En attente",urssafPaye:false},

// ── FILTERS / CHARTS ──────────────────────────────────
function getMoisList(){
  const mois=missions.filter(m=>!fY||primaryDate(m).slice(0,4)===fY);
  return Array.from(new Set(mois.map(m=>primaryDate(m).slice(0,7)).filter(Boolean))).sort();
}
function getAnneeList(){return Array.from(new Set(missions.map(m=>primaryDate(m).slice(0,4)).filter(Boolean))).sort();}
function getFiltered(){
  let list=missions.filter(m=>{
    if(fC&&m.client!==fC)return false;
    if(fS&&m.statut!==fS)return false;
    if(fU==="paye"&&!m.urssafPaye)return false;
    if(fU==="non"&&m.urssafPaye)return false;
    const pd=primaryDate(m);
    if(fY&&pd.slice(0,4)!==fY)return false;
    if(fM&&pd.slice(0,7)!==fM)return false;
    if(fQ&&!m.intitule.toLowerCase().includes(fQ.toLowerCase())&&!m.type.toLowerCase().includes(fQ.toLowerCase()))return false;
    return true;
  });
  list.sort((a,b)=>sortAsc?primaryDate(a).localeCompare(primaryDate(b)):primaryDate(b).localeCompare(primaryDate(a)));
  return list;
}

// ── SATISFACTION SECTION ──────────────────────────────
function buildSatSection(){
  const pool=missions.filter(m=>{const c=getClient(m.client);return c&&!c.certifiante&&m.satisfaction!=null&&m.satisfaction!=="";});
  let list=pool;
  if(satFC)list=list.filter(m=>m.client===satFC);
  if(satFT)list=list.filter(m=>m.type===satFT);
  if(satFTh)list=list.filter(m=>m.theme===satFTh);
  const byClient={},byType={},byTheme={};
  list.forEach(m=>{
    const s=parseFloat(m.satisfaction);if(isNaN(s))return;
    const add=(obj,k)=>{if(!obj[k]){obj[k]={sum:0,count:0};}obj[k].sum+=s;obj[k].count++;};
    add(byClient,m.client);add(byType,m.type);if(m.theme)add(byTheme,m.theme);
  });
  function cards(obj){
    const entries=Object.entries(obj);
    if(!entries.length)return'<span style="color:#ccc;font-size:12px;font-style:italic">Aucune donnée</span>';
    return entries.sort((a,b)=>b[1].sum/b[1].count-a[1].sum/a[1].count).map(([k,{sum,count}])=>{
      const avg=(sum/count).toFixed(1);const cls=satCls(parseFloat(avg));
      return`<div class="sat-card ${cls}"><div class="sat-card-label">${k}</div><div class="sat-card-value">${avg}%</div><div class="sat-card-sub">${count} formation${count>1?"s":""}</div></div>`;
    }).join("");
  }
  const sC=[...new Set(pool.map(m=>m.client))];const sT=[...new Set(pool.map(m=>m.type))];const sTh=[...new Set(pool.map(m=>m.theme).filter(Boolean))];
  const cOp=sC.map(c=>`<option value="${c}"${satFC===c?" selected":""}>${c}</option>`).join("");
  const tOp=sT.map(t=>`<option value="${t}"${satFT===t?" selected":""}>${t}</option>`).join("");
  const thOp=sTh.map(t=>`<option value="${t}"${satFTh===t?" selected":""}>${t}</option>`).join("");
  return`<div class="sat-section">
    <div class="sat-header">
      <h4>📊 Satisfaction — formations continues (hors certifiantes)</h4>
      <div class="sat-filters">
        ${sC.length>1?`<select onchange="satFC=this.value;render()"><option value="">Tous les clients</option>${cOp}</select>`:""}
        ${sT.length>1?`<select onchange="satFT=this.value;render()"><option value="">Tous les types</option>${tOp}</select>`:""}
        ${sTh.length>1?`<select onchange="satFTh=this.value;render()"><option value="">Toutes les thématiques</option>${thOp}</select>`:""}
        <span class="sat-count">${list.length} formation${list.length!==1?"s":""}</span>
      </div>
    </div>
    ${list.length===0
      ?`<div class="sat-empty">Aucun taux de satisfaction renseigné pour les formations continues.<br>Éditez vos missions Formasuite et renseignez la thématique + le taux obtenu.</div>`
      :`<div class="sat-groups">
        <div><div class="sat-group-title">Par organisme</div><div class="sat-cards">${cards(byClient)}</div></div>
        <div><div class="sat-group-title">Par type de prestation</div><div class="sat-cards">${cards(byType)}</div></div>
        ${Object.keys(byTheme).length?`<div><div class="sat-group-title">Par thématique</div><div class="sat-cards">${cards(byTheme)}</div></div>`:""}
      </div>`}
  </div>`;
}

function submitClient(){
  // Safety DOM reads
  const n=document.getElementById("cf_name");if(n)clientModal.form.name=n.value;
  const j=document.getElementById("cf_jours");if(j)clientModal.form.delai.jours=parseInt(j.value)||0;
  clientModal.form.tarifs.forEach((t,i)=>{
    const l=document.getElementById(`cf_l${i}`);const tx=document.getElementById(`cf_t${i}`);

    if(tx)clientModal.form.tarifs[i].taux=parseFloat(tx.value)||0;
  });
  const f=clientModal.form;
  if(!f.name.trim()){alert("Nom obligatoire.");return;}
  if(f.tarifs.some(t=>!t.label.trim())){alert("Chaque tarif doit avoir un libellé.");return;}
  const data={name:f.name.trim(),hex:f.hex,certifiante:f.certifiante,tarifs:f.tarifs.map(t=>({...t})),delai:{...f.delai}};
  if(clientModal.mode==="edit"){
    const old=clients[clientModal.editIdx].name;

    if(old!==data.name){missions=missions.map(m=>m.client===old?{...m,client:data.name}:m);persist();}
  }else{
    if(clients.some(c=>c.name.toLowerCase()===data.name.toLowerCase())){alert("Client déjà existant.");return;}

  saveClients();clientModal={mode:"list"};render();
}

    return`<div class="modal-bg" id="mbg2"><div class="modal"><div class="modal-title"><h3>Gérer les clients</h3><span class="pill clients">Clients</span></div><div class="client-list-items">${rows||'<p style="color:#bbb;font-size:13px;text-align:center;padding:1rem">Aucun client</p>'}</div><button class="btn-new-client" onclick="openClientNew()">+ Nouveau client</button><div class="modal-footer"><button class="btn-cancel" onclick="closeClientModal()">Fermer</button></div></div></div>`;
  }
  const f=clientModal.form;const isEdit=clientModal.mode==="edit";
  const pal=COLOR_PALETTE.map(h=>`<div class="color-swatch${f.hex===h?" selected":""}" style="background:${h}" onclick="setCF('hex','${h}')"></div>`).join("");
  const tar=f.tarifs.map((t,i)=>`<div class="tarif-row">
    <input id="cf_l${i}" type="text" placeholder="Libellé" value="${t.label.replace(/"/g,'&quot;')}" onchange="setTarif(${i},'label',this.value)" style="flex:2;min-width:0">
    <input id="cf_t${i}" type="number" placeholder="Taux" min="0" step="0.5" value="${t.taux||''}" onchange="setTarif(${i},'taux',this.value)" style="width:75px;flex-shrink:0">
    <select onchange="setTarif(${i},'unite',this.value)" style="width:65px;flex-shrink:0"><option value="h"${t.unite==="h"?" selected":""}>€/h</option><option value="j"${t.unite==="j"?" selected":""}>€/j</option></select>
    ${f.tarifs.length>1?`<button class="btn-remove-tarif" onclick="removeTarif(${i})">×</button>`:""}
  </div>`).join("");
  return`<div class="modal-bg" id="mbg2"><div class="modal">
    <div class="modal-title"><h3>${isEdit?"Modifier":"Nouveau client"}</h3><span class="pill ${isEdit?"edit":"new"}">${isEdit?"Édition":"Nouveau"}</span></div>
    <div class="form-row"><label>Nom *</label><input id="cf_name" type="text" placeholder="ex : Mon Organisme" value="${f.name.replace(/"/g,'&quot;')}" onchange="setCF('name',this.value)"></div>
    <div class="form-row"><label>Couleur</label>
      <div class="color-palette">${pal}</div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:10px"><div style="width:22px;height:22px;border-radius:50%;background:${f.hex}"></div><span class="client-pill" style="background:${f.hex}22;color:${f.hex}">${f.name||"Aperçu"}</span></div>
    </div>
    <div class="form-row"><label>Type de formation</label>
      <select onchange="setCF('certifiante',this.value==='oui')">
        <option value="non"${!f.certifiante?" selected":""}>Formation continue / intra</option>
        <option value="oui"${f.certifiante?" selected":""}>Titre professionnel / Certifiante</option>
      </select>
      <div class="form-hint">${f.certifiante?"Satisfaction non trackée":"Satisfaction trackée ✓"}</div>
    </div>
    <div class="section-label">Tarifs</div>
    ${tar}<button class="btn-add-tarif" onclick="addTarif()">+ Ajouter un tarif</button>
    <div class="section-label" style="margin-top:16px">Délai de règlement</div>
    <div class="form-2col">
      <div class="form-row"><label>Jours après facturation</label><input id="cf_jours" type="number" min="0" step="1" value="${f.delai.jours}" onchange="setCFDelai('jours',this.value)"></div>
      <div class="form-row"><label>Règle</label><select onchange="setCFDelai('regle',this.value)"><option value="standard"${f.delai.regle==="standard"?" selected":""}>Standard</option><option value="le15"${f.delai.regle==="le15"?" selected":""}>→ Le 15 du mois</option></select></div>
    </div>
    <div class="modal-footer"><button class="btn-cancel" onclick="backToList()">← Retour</button><button class="btn-save" onclick="submitClient()">${isEdit?"Enregistrer":"Créer"}</button></div>
  </div></div>`;
}

// ── ACTIONS ───────────────────────────────────────────
function updateStatut(id,val){missions=missions.map(m=>m.id===id?{...m,statut:val}:m);persist();render();}
function toggleUrssaf(id){missions=missions.map(m=>m.id===id?{...m,urssafPaye:!m.urssafPaye}:m);persist();render();}
function delMission(id){if(!confirm("Supprimer cette mission ?"))return;missions=missions.filter(m=>m.id!==id);persist();render();}
function toggleSort(){sortAsc=!sortAsc;render();}
function toggleSat(){showSat=!showSat;render();}

// ── RENDER ────────────────────────────────────────────
function render(){
  const list=getFiltered();const todayStr=new Date().toISOString().slice(0,10);
  const src=fM?list:missions;
  const total=src.reduce((s,m)=>s+ca(m),0);
  const enc=src.filter(m=>m.statut==="Payé").reduce((s,m)=>s+ca(m),0);
  const att=src.filter(m=>m.statut==="En attente").reduce((s,m)=>s+ca(m),0);
  const urssafR=src.filter(m=>!m.urssafPaye).reduce((s,m)=>s+urssafM(m),0);
  const totJ=src.reduce((s,m)=>s+joursM(m),0);
  const today=new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});
  const anneeList=getAnneeList();
  const anneeOpts=anneeList.map(a=>`<option value="${a}"${fY===a?" selected":""}>${a}</option>`).join("");
  const moisList=getMoisList();
  const moisOpts=moisList.map(m=>`<option value="${m}"${fM===m?" selected":""}>${fmtMois(m)}</option>`).join("");
  const clientOpts=clients.map(c=>`<option value="${c.name}"${fC===c.name?" selected":""}>${c.name}</option>`).join("");
  const legend=clients.map(c=>`<div class="cl-item"><div class="cl-dot" style="background:${c.hex}"></div>${c.name}</div>`).join("");
  let sep=false,rows="";
  list.forEach(m=>{
    const pd=primaryDate(m);const fut=pd>todayStr;
    if(sortAsc&&!sep&&fut){sep=true;rows+=`<tr class="sep-row"><td colspan="13">— À venir —</td></tr>`;}
    const reg=regStatus(m.dateFacture,m.client,m.statut);const col=clientColor(m.client);
    const sb=(!isCert(m.client)&&m.satisfaction!=null&&m.satisfaction!=="")
      ?`<span class="sat-badge ${satCls(parseFloat(m.satisfaction))}">${parseFloat(m.satisfaction).toFixed(1)}%</span>`:"";
    rows+=`<tr${fut?' class="future"':""}>
      <td><span class="client-pill" style="background:${col.bg};color:${col.text}">${m.client}</span></td>
      <td><span class="badge type">${m.type}</span></td>
      <td style="max-width:160px">${m.intitule}${sb}${m.theme?`<br><span style="font-size:10px;color:#bbb">${m.theme}</span>`:""}</td>
      <td style="white-space:nowrap;color:#888;font-size:12px">${fmtMissionDate(m)}</td>
      <td style="white-space:nowrap;color:#aaa;font-size:12px">${m.dateFacture?fd(m.dateFacture):"—"}</td>
      <td style="white-space:nowrap;color:#aaa">${m.taux} €/${m.unite}</td>
      <td style="text-align:center">${qteLabel(m)}</td>
      <td style="font-weight:700;white-space:nowrap">${fmt(ca(m))}</td>
      <td><select class="mini-select" onchange="updateStatut(${m.id},this.value)">${STATUTS.map(s=>`<option${m.statut===s?" selected":""}>${s}</option>`).join("")}</select></td>
      <td style="color:#aaa;font-size:12px">${fmt(urssafM(m))}</td>
      <td><span class="${m.urssafPaye?"badge urssaf-ok":"badge urssaf-no"}" onclick="toggleUrssaf(${m.id})">${m.urssafPaye?"Payée":"Non payée"}</span></td>
      <td><span class="${reg.cls}">${reg.label}</span></td>
      <td><div class="actions"><button class="btn-edit" onclick="openEdit(${m.id})">✏️</button><button class="btn-del" onclick="delMission(${m.id})">✕</button></div></td>
    </tr>`;
  });
  const delaisItems=clients.map(c=>{const d=c.delai;return`<div class="delais-item"><strong>${c.name} : ${d.regle==="le15"?`${d.jours}j→le 15`:`${d.jours}j`}</strong></div>`;}).join("");

  document.getElementById("app").innerHTML=`
<div class="db-header">
  <div class="db-logo-wrap"><img class="db-logo-img" src="${LOGO_SRC}" alt="23 MindSet"><div class="db-logo-text">23 <span>MindSet</span></div></div>
  <div class="db-header-right"><button class="btn-clients" onclick="openClientManage()">⚙ Gérer les clients</button><div class="db-date">${today}</div></div>
</div>
<div class="kpi-grid">
  <div class="kpi accent"><div class="kpi-label">${fM?"CA — "+fmtMois(fM):"CA total"}</div><div class="kpi-value">${fmt(total)}</div><div class="kpi-sub">${src.length} mission${src.length>1?"s":""}</div></div>
  <div class="kpi"><div class="kpi-label">Encaissé</div><div class="kpi-value">${fmt(enc)}</div><div class="kpi-sub">${src.filter(m=>m.statut==="Payé").length} payée${src.filter(m=>m.statut==="Payé").length>1?"s":""}</div></div>
  <div class="kpi"><div class="kpi-label">En attente</div><div class="kpi-value">${fmt(att)}</div></div>
  <div class="kpi warn"><div class="kpi-label">Jours travaillés</div><div class="kpi-value">${totJ.toFixed(1)}j</div><div class="kpi-sub">URSSAF restante : ${fmt(urssafR)}</div></div>
</div>
<div class="charts-section">
  <div class="chart-card"><h4>Évolution mensuelle — CA &amp; jours</h4><div class="chart-wrap"><canvas id="chartEvol"></canvas></div></div>
  <div class="chart-card"><h4>CA par client</h4><div class="chart-wrap"><canvas id="chartPie"></canvas></div><div class="client-legend">${legend}</div></div>
</div>
<div class="toolbar">
  <input type="text" placeholder="Rechercher…" value="${fQ}" oninput="fQ=this.value;render()" style="width:130px">
  <select onchange="fY=this.value;fM='';render()"><option value="">Toutes les années</option>${anneeOpts}</select>
  <select onchange="fM=this.value;render()"><option value="">Tous les mois</option>${moisOpts}</select>
  <select onchange="fC=this.value;render()"><option value="">Tous les clients</option>${clientOpts}</select>
  <select onchange="fS=this.value;render()"><option value="">Tous les statuts</option>${STATUTS.map(s=>`<option value="${s}"${fS===s?" selected":""}>${s}</option>`).join("")}</select>
  <select onchange="fU=this.value;render()"><option value="">URSSAF : tous</option><option value="paye"${fU==="paye"?" selected":""}>Payée</option><option value="non"${fU==="non"?" selected":""}>Non payée</option></select>
  <button class="btn-sort${sortAsc?" active":""}" onclick="toggleSort()">${sortAsc?"↑ Date":"↓ Date"}</button>
  <button class="btn-sat${showSat?" active":""}" onclick="toggleSat()">📊 Satisfaction</button>
  <button class="btn-add" onclick="openNew()">+ Ajouter</button>
</div>
<div class="table-wrap"><table>
  <thead><tr><th>Client</th><th>Type</th><th>Mission</th><th>Date(s)</th><th>Facture</th><th>Taux</th><th>Qté</th><th>Montant</th><th>Statut</th><th>URSSAF</th><th>URSSAF</th><th>Règlement</th><th></th></tr></thead>
  <tbody>${rows||`<tr><td colspan="13" class="empty">Aucune mission</td></tr>`}</tbody>
</table></div>
${showSat?buildSatSection():""}
<div class="urssaf-bar">
  <div class="urssaf-item">URSSAF : <strong>26%</strong></div>
  <div class="urssaf-item">Total dû : <strong>${fmt(missions.reduce((s,m)=>s+urssafM(m),0))}</strong></div>
  <div class="urssaf-item">Réglée : <strong>${fmt(missions.reduce((s,m)=>s+urssafM(m),0)-missions.filter(m=>!m.urssafPaye).reduce((s,m)=>s+urssafM(m),0))}</strong></div>
  <div class="urssaf-item">Restant : <strong class="warn">${fmt(missions.filter(m=>!m.urssafPaye).reduce((s,m)=>s+urssafM(m),0))}</strong></div>
  <div class="urssaf-item" style="margin-left:auto;font-size:11px;color:#ccc">Données sauvegardées localement</div>
</div>
<div class="delais-info"><span>Délais :</span>${delaisItems}</div>
${modal?buildModal():""}${clientModal?buildClientModal():""}`;

  if(modal){const bg=document.getElementById("mbg");if(bg)bg.addEventListener("click",e=>{if(e.target.id==="mbg")closeModal();});}
  if(clientModal){const bg2=document.getElementById("mbg2");if(bg2)bg2.addEventListener("click",e=>{if(e.target.id==="mbg2")closeClientModal();});}
  setTimeout(buildCharts,0);
}
render();
</script>
</body>
</html>
